name: Depot testing - macOS (mock release)

on:
  workflow_dispatch:

# Same library preparation, paths and cache keys as deploy_mac_depot.yml.
# No production application cache is read/written. Test artifacts contain fake
# API credentials and are signed only with a freshly generated throwaway RSA key.
permissions:
  contents: read

jobs:
  build-libraries:
    if: github.repository_owner == 'cpartisans'
    name: Libraries 
    runs-on: depot-macos-latest
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share
          brew update
          brew upgrade || true
          brew install automake libtool meson nasm ninja pkg-config

          sudo mdutil -a -i off

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # Restore/save is explicit (not the combined actions/cache): the
      # combined action saves in a post step gated on job success, so
      # every failed signing or packing attempt was discarding the full
      # library build. The save below runs right after the prune step.
      # The key has no architecture: prepare.py builds every macOS
      # library universal, so both halves share one tree (and, on a cold
      # cache, race to save it - the loser only warns).
      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libsrel-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-libsrel-

      - name: Libraries.
        run: |
          ./$REPO_NAME/Telegram/build/prepare/mac.sh silent

      - name: Free up some disk space.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      - name: Save Libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

  macos-build:
    needs: build-libraries
    name: Telegram (${{ matrix.arch }})
    runs-on: depot-macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x86_64

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      ARTIFACT_NAME: "PTelegram_DEPOT_TEST_"
      REPO_NAME: ${{ github.event.repository.name }}
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      CP_ARCH: ${{ matrix.arch }}

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          # Not recursive, see the Windows job: nothing macOS compiles
          # lives in a nested submodule, and recursing would clone
          # cppgir from gitlab.com once per arch of this matrix.
          persist-credentials: false
          submodules: true
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share

          brew update
          brew upgrade || true
          brew install automake meson nasm ninja pkg-config

          brew install icoutils create-dmg

          sudo mdutil -a -i off

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # Restore/save is explicit (not the combined actions/cache): the
      # combined action saves in a post step gated on job success, so
      # every failed signing or packing attempt was discarding the full
      # library build. The save below runs right after the prune step.
      # The key has no architecture: prepare.py builds every macOS
      # library universal, so both halves share one tree (and, on a cold
      # cache, race to save it - the loser only warns).
      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libsrel-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-libsrel-

      - name: Telegram Desktop build (${{ matrix.arch }}).
        env:
          API_ID: "1"
          API_HASH: "00000000000000000000000000000000"
          # Existing build.sh test mode bypasses real certificate operations.
          PTG_TESTBUILD: "1"
          MACOS_CERTIFICATE: ""
          MACOS_CERTIFICATE_PWD: ""
        run: |
          MOCK_RSA=$(mktemp)
          trap 'rm -f "$MOCK_RSA"' EXIT
          openssl genrsa -traditional -out "$MOCK_RSA" 2048
          export RSA_PRIVATE=$(python3 -c 'import base64, pathlib, sys; print(base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode())' "$MOCK_RSA")
          cd "$REPO_NAME/Telegram/build"
          python3 cmake_failure_diagnostics.py --root ../.. -- python3 release_build.py mac

      - name: Check build result.
        run: |
          filePath="$REPO_NAME/out/Release/deploy"
          if test -d "$filePath"; then
            echo "${{ matrix.arch }} build successfully done! :)"

            ls $filePath
          else
            echo "Build error, output file does not exist."
            exit 1
          fi

      - name: Move artifact.
        run: |
          cd $REPO_NAME/out/Release/deploy
          mkdir -p ../artifact
          mv * ../artifact || true

      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload ${{ matrix.arch }} update files.
        with:
          name: ${{ env.ARTIFACT_NAME }}${{ matrix.arch }}_tg
          path: ${{ env.REPO_NAME }}/out/Release/artifact/t*macupd*

      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload ${{ matrix.arch }} app bundle.
        with:
          name: ${{ env.ARTIFACT_NAME }}${{ matrix.arch }}_app
          path: ${{ env.REPO_NAME }}/out/Release/artifact/*.zip

      - uses: actions/upload-artifact@v7
        name: Upload ${{ matrix.arch }} symbols artifact.
        if: false
        with:
          name: symbols_${{ matrix.arch }}
          path: ${{ env.REPO_NAME }}/out/Dropbox/Telegram/symbols/*

  macos-combine:
    needs: macos-build
    name: Telegram (Universal)
    runs-on: macos-latest

    env:
      UPLOAD_ARTIFACT: "true"
      ARTIFACT_NAME: "PTelegram_DEPOT_TEST_"
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Clone.
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share

          brew update
          brew upgrade || true
          brew install icoutils create-dmg

          # Disable spotlight.
          sudo mdutil -a -i off

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Create work directory.
        run: |
          mkdir -p combine_work

      - name: Download ARM64 artifacts.
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}arm64_app
          path: combine_work

      - name: Download x86_64 artifacts.
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}x86_64_app
          path: combine_work

      - name: Extract architecture-specific bundles.
        run: |
          cd combine_work
          ls -la
          
          # Extract ARM64 bundle
          unzip -q Telegram.arm64.app.zip 2>/dev/null || true
          
          # Rename extracted ARM64 app if needed
          if [ -d "Telegram.app" ]; then
            mv Telegram.app Telegram.arm64.app
          fi
          
          # Extract x86_64 bundle
          unzip -q Telegram.x86_64.app.zip 2>/dev/null || true
          
          # Rename extracted x86_64 app if needed
          if [ -d "Telegram.app" ]; then
            mv Telegram.app Telegram.x86_64.app
          fi
          
          # Verify both bundles exist
          if [ ! -d "Telegram.arm64.app" ] || [ ! -d "Telegram.x86_64.app" ]; then
            echo "ERROR: Missing one or both architecture bundles"
            ls -la
            exit 1
          fi
          
          ls -la

      - name: Combine architectures.
        env:
          MACOS_CERTIFICATE: ""
          MACOS_CERTIFICATE_PWD: ""
        run: |
          cd combine_work
          ${{ github.workspace }}/${{ env.REPO_NAME }}/Telegram/build/build_mac_release.sh .

      - name: Create output directory.
        run: |
          mkdir -p output
          cd combine_work
          
          # Copy universal app zip
          if [ -f "Telegram.app.zip" ]; then
            cp Telegram.app.zip ../output/
          fi
          
          # Copy DMG
          if [ -f "tsetup.latest.dmg" ]; then
            cp tsetup.latest.dmg ../output/
          fi
          
          ls -la ../output

      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload universal app.
        with:
          name: ${{ env.ARTIFACT_NAME }}_universal_app
          path: output/Telegram.app.zip

      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload universal DMG.
        with:
          name: depot-testing-telegram-dmg
          path: output/tsetup.latest.dmg
